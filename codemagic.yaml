workflows:
  ios-testflight:
    name: AppPostIt iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Reuses the same App Store Connect API key integration set up for
      # the allergybuster project -- the key's App Manager role is
      # account-wide, not scoped to one app, so this works as long as
      # both projects are under the same Codemagic team.
      app_store_connect: AllergyBuster
    environment:
      # No `ios_signing:` block here on purpose -- that's Codemagic's own
      # automatic signing shortcut, and it only takes a single bundle ID.
      # It runs before any of our scripts, so with two targets to sign it
      # fails immediately on the one bundle ID it does know about, before
      # the "Set up code signing for both targets" script below (which
      # explicitly handles both) ever gets a chance to run. Signing is
      # handled entirely by that script instead.
      vars:
        BUNDLE_ID: "com.apppostit.apppostit"
        KEYBOARD_BUNDLE_ID: "com.apppostit.apppostit.keyboard"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Add the keyboard extension target
        script: |
          gem install xcodeproj --no-document
          ruby ios/scripts/add_keyboard_extension.rb
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Set up code signing for both targets
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "$KEYBOARD_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip to true once you're ready for testers beyond your internal
        # App Store Connect team, after Apple's (usually automatic) beta
        # review.
        beta_groups: []
